# Ported from upstream's studio.planetpeanut.Bobby.devel.yml. Upstream's
# devel manifest differs from its release one in three ways: branch: devel,
# a `dir` source pointing at the checkout instead of a release archive, and
# --share=network on the build so cargo can resolve crates without a prior
# vendoring step. The port's bobby module already needs --share=network in
# studio.planetpeanut.Bobby.yml (see the comment there — there is no release
# tarball yet for a vendored build to point at), so this file's only
# differences from that one are branch: devel and the `dir` source, exactly
# matching upstream's own two differences.
#
# .github/workflows/flatpak.yml (ported from upstream's
# .github/workflows/flatpak.yml) builds from this manifest, same as
# upstream's CI does.
app-id: studio.planetpeanut.Bobby
branch: devel
command: bobby

runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk

finish-args:
  - --device=dri
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --env=GEM_HOME=/app/lib/bobby-rb/gems
  - --env=GEM_PATH=/app/lib/bobby-rb/gems
  - --env=RUBYLIB=/app/lib/bobby-rb/lib

modules:
  - name: ruby
    buildsystem: simple
    build-commands:
      - ./configure --prefix=/app --disable-install-doc
      - make -j${FLATPAK_BUILDER_N_JOBS:-4}
      - make install
    sources:
      - type: archive
        url: https://cache.ruby-lang.org/pub/ruby/3.4/ruby-3.4.9.tar.gz
        sha256: 7bb4d4f5e807cc27251d14d9d6086d182c5b25875191e44ab15b709cd7a7dd9c

  - name: bobby
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
      env:
        BUNDLE_GEMFILE: Gemfile.flatpak
    build-commands:
      - bundle config set --local path 'gems'
      - bundle config set --local without 'development test'
      - bundle install
      - mkdir -p /app/lib/bobby-rb
      - cp -r lib /app/lib/bobby-rb/lib
      - cp -r gems /app/lib/bobby-rb/gems
      - install -Dm755 exe/bobby /app/bin/bobby
      - install -Dm644 data/studio.planetpeanut.Bobby.desktop
        /app/share/applications/studio.planetpeanut.Bobby.desktop
      - install -Dm644 data/studio.planetpeanut.Bobby.metainfo.xml
        /app/share/metainfo/studio.planetpeanut.Bobby.metainfo.xml
      - install -Dm644 data/studio.planetpeanut.Bobby.gschema.xml
        /app/share/glib-2.0/schemas/studio.planetpeanut.Bobby.gschema.xml
      - install -Dm644
        data/icons/hicolor/scalable/apps/studio.planetpeanut.Bobby.svg
        /app/share/icons/hicolor/scalable/apps/studio.planetpeanut.Bobby.svg
      - install -Dm644
        data/icons/hicolor/symbolic/apps/studio.planetpeanut.Bobby-symbolic.svg
        /app/share/icons/hicolor/symbolic/apps/studio.planetpeanut.Bobby-symbolic.svg
    sources:
      - type: dir
        path: "."
